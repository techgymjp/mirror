<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0914">
<title>犬も歩けば鏡に当たる</title>
<meta name="description" content="壁がぜんぶ鏡の迷路から、犬になって脱出するカジュアルゲーム。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="view">
  <canvas id="screen" width="320" height="240"></canvas>
  <div id="flash"></div>

  <div id="hud" hidden>
    <div class="hud-top">
      <div id="stageName" class="stage-name"></div>
      <div class="stats">
        <span data-i18n-title="hud.time" title="タイム">⏱ <b id="hudTime">0:00.0</b></span>
        <span data-i18n-title="hud.warps" title="ワープした回数">🌀 <b id="hudWarp">0</b></span>
        <span id="hudBoneWrap" class="bone-count" data-i18n-title="hud.bones" title="持っているほね（1本でゴン1回セーフ）">🦴 <b id="hudBone">0</b></span>
      </div>
      <div class="buttons">
        <button id="btnMap" class="hud-btn" data-i18n-title="hud.map" aria-label="地図">🗺</button>
        <button id="btnCam" class="hud-btn" aria-label="視点">🐕</button>
        <button class="hud-btn btn-music" aria-label="BGM">♪</button>
        <button class="hud-btn btn-sound" aria-label="音">🔊</button>
        <button id="btnPause" class="hud-btn" data-i18n-title="hud.pause" aria-label="一時停止">Ⅱ</button>
      </div>
    </div>
    <div id="compass" class="compass"><div id="compassNeedle" class="needle"></div><div id="compassLabel" class="label">北へ</div></div>
    <canvas id="minimap" width="132" height="132"></canvas>
    <div id="turnInd" class="turn-ind"></div>
    <div id="popup" class="popup"></div>
    <div id="hint" class="hint"></div>
  </div>

  <section id="title" class="overlay title" hidden>
    <div class="panel title-panel">
      <p class="kicker">🐕 MIRROR MAZE</p>
      <h1 data-i18n-html="title.h1">犬も歩けば<br><span>鏡に当たる</span></h1>
      <p class="lead" data-i18n-html="title.lead">壁はぜんぶ鏡。見えている道は、本物？ 映りこみ？<br>走りつづける犬をフリックで導いて、たった一つの出口へ！<br>鏡に当たったら一発アウト！</p>
      <div id="stageList" class="stage-list"></div>
      <div class="row-btns">
        <button id="btnHowto" class="btn ghost" data-i18n="btn.howto">遊び方</button>
        <button class="btn ghost btn-music" aria-label="BGM">♪ BGM</button>
        <button class="btn ghost btn-sound" aria-label="音">🔊</button>
      </div>
      <!-- web-only -->
      <p class="store-link"><a href="https://play.google.com/store/apps/details?id=jp.techgym.mirror" target="_blank" rel="noopener" data-i18n="title.getAndroid">▶ Android アプリ版（Google Play）</a></p>
      <!-- /web-only -->
      <p class="lang-sel"><button class="lang-btn" data-lang="ja">日本語</button><button class="lang-btn" data-lang="en">English</button></p>
      <p class="legal">
        <span id="buildInfo"></span>
        <a href="https://techgym.jp/privacy-policy/" data-i18n-href="url.privacy" target="_blank" rel="noopener" data-i18n="legal.privacy">プライバシーポリシー</a>
        <span id="adPrivacy" hidden>｜<a href="#" id="adPrivacyLink" data-i18n="legal.adSettings">広告の設定</a></span>
      </p>
    </div>
  </section>

  <section id="howto" class="overlay" hidden>
    <div class="panel howto">
      <h2 data-i18n="howto.title">遊び方</h2>
      <ul>
        <li data-i18n-html="howto.1"></li>
        <li data-i18n-html="howto.2"></li>
        <li data-i18n-html="howto.3"></li>
        <!-- web-only -->
        <li data-i18n-html="howto.pc"></li>
        <!-- /web-only -->
        <li data-i18n-html="howto.4"></li>
        <li data-i18n-html="howto.5"></li>
        <li data-i18n-html="howto.6"></li>
        <li data-i18n-html="howto.7"></li>
        <li data-i18n-html="howto.8"></li>
        <li data-i18n-html="howto.9"></li>
        <li data-i18n-html="howto.10"></li>
        <li data-i18n-html="howto.11"></li>
      </ul>
      <button id="btnHowtoBack" class="btn" data-i18n="btn.back">もどる</button>
    </div>
  </section>

  <section id="pause" class="overlay" hidden>
    <div class="panel small">
      <h2 data-i18n="pause.title">ひと休み</h2>
      <button id="btnResume" class="btn" data-i18n="btn.resume">つづける</button>
      <button id="btnRetry" class="btn ghost" data-i18n="btn.restart">やり直す</button>
      <button id="btnQuit" class="btn ghost" data-i18n="btn.toTitle">タイトルへ</button>
    </div>
  </section>

  <section id="over" class="overlay" hidden>
    <div class="panel small">
      <p id="overKicker" class="kicker">💥 ゴン！</p>
      <h2 data-i18n="over.title">ゲームオーバー</h2>
      <p class="over-msg" data-i18n-html="over.msg">鏡にぶつかってしまった…<br>次は曲がり角を見きわめよう！</p>
      <div id="overStats" class="clear-stats"></div>
      <button id="btnOverRetry" class="btn" data-i18n="btn.again">もう一度</button>
      <button id="btnShareOver" class="btn ghost" data-i18n="btn.share">シェア</button>
      <button id="btnOverTitle" class="btn ghost" data-i18n="btn.toTitle">タイトルへ</button>
    </div>
  </section>

  <!-- アプリのみ：リワード広告を見て、ぶつかった場所からつづける -->
  <div id="redo" class="redo" hidden>
    <p id="redoNote"></p>
    <button id="redoWatch" class="btn">▶ 広告を見て、つづきから</button>
    <button id="redoSkip" class="btn ghost">あきらめる</button>
  </div>

  <section id="clear" class="overlay" hidden>
    <div class="panel small">
      <p class="kicker" data-i18n="clear.kicker">🐾 ワン！</p>
      <h2 id="clearTitle">脱出成功！</h2>
      <div id="clearStars" class="stars">★★★</div>
      <div id="clearStats" class="clear-stats"></div>
      <button id="btnNext" class="btn">次のステージへ</button>
      <button id="btnAgain" class="btn ghost" data-i18n="btn.again">もう一度</button>
      <button id="btnShareClear" class="btn ghost" data-i18n="btn.share">シェア</button>
      <button id="btnTitle" class="btn ghost" data-i18n="btn.toTitle">タイトルへ</button>
    </div>
  </section>
</div>

<script src="js/ads-config.js"></script>
<script src="js/build-info.js"></script>
<script src="js/i18n.js"></script>
<script src="js/maze.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ads.js"></script>
<script src="js/game.js"></script>
</body>
</html>
